[package]
name = "ic-sqlite-vfs"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "SQLite VFS backed directly by Internet Computer stable memory"
readme = "README.md"
documentation = "https://docs.rs/ic-sqlite-vfs"
repository = "https://github.com/humandebri/ic-sqlite-vfs"
keywords = ["sqlite", "internet-computer", "stable-memory", "vfs", "icp"]
categories = ["database", "embedded", "wasm"]
exclude = [
  "/.github/",
  "/.icp/",
  "/node_modules/",
  "/target/",
  "/package-lock.json",
  "/package.json",
]

[features]
default = ["sqlite-bundled"]
bench-profile = []
canister-api = []
canister-api-test-failpoints = ["canister-api"]
sqlite-bundled = []
sqlite-precompiled = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.20.1"
ic-stable-structures = "0.7"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
serial_test = "3"
