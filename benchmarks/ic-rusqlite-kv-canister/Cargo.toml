[package]
name = "ic-rusqlite-kv-bench"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.20.1"
ic-rusqlite = { version = "0.5.0", default-features = false, features = ["precompiled"] }
serde = { version = "1", features = ["derive"] }
