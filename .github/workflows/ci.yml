name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install WASI SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep wasi-libc clang wabt unzip
          sudo ln -sf "$(command -v clang)" /usr/local/bin/wasm32-wasi-clang
      - name: Install Verus
        env:
          VERUS_VERSION: 0.2026.05.05.d03e906
          VERUS_SHA256: 09c0ef9f59995a9c0e26c2a47ef6a6fc437d67816aca1685d05b872519af426c
        run: |
          curl -L -o "$RUNNER_TEMP/verus.zip" "https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          echo "${VERUS_SHA256}  $RUNNER_TEMP/verus.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/verus.zip" -d "$RUNNER_TEMP/verus"
          verus_bin="$(find "$RUNNER_TEMP/verus" -type f -name verus -perm -111 | head -n 1)"
          test -n "$verus_bin"
          echo "$(dirname "$verus_bin")" >> "$GITHUB_PATH"
          "$verus_bin" --version
      - run: npm ci
      - run: cargo fmt --check
      - run: bash scripts/check-release-version.sh
      - run: scripts/check-sqlite-precompiled.sh
      - run: VERUS_REQUIRED=1 bash scripts/sqlite-critical-check.sh
      - run: cargo build --release --target wasm32-unknown-unknown
      - run: cargo build --release --target wasm32-unknown-unknown --features canister-api
      - run: scripts/check-wasm-contract.sh target/wasm32-unknown-unknown/release/ic_sqlite_vfs.wasm
      - run: npm run test:pocketic:regression
      - run: npm run test:pocketic:perf
      - run: scripts/check-release-package.sh
      - run: npm run build:wasm
      - run: scripts/check-wasm-contract.sh target/pocketic/ic_sqlite_vfs.wasm
