name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install WASI SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep wasi-libc clang wabt
          sudo ln -sf "$(command -v clang)" /usr/local/bin/wasm32-wasi-clang
      - run: npm ci
      - run: cargo fmt --check
      - run: bash scripts/sqlite-critical-check.sh
      - name: Check release version and tag
        run: bash scripts/check-release-version.sh --require-pushed-tag
      - run: cargo package --no-verify
      - run: cargo build --target wasm32-unknown-unknown
      - run: cargo build --target wasm32-unknown-unknown --features canister-api
      - run: npm run test:pocketic:perf
      - name: Check wasm imports
        run: |
          imports="$(wasm-objdump -x target/wasm32-unknown-unknown/debug/ic_sqlite_vfs.wasm | grep '<-' || true)"
          echo "$imports"
          if echo "$imports" | grep -v '<- ic0\.'; then
            echo "unexpected non-ic0 import" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: target/wasm32-unknown-unknown/debug/ic_sqlite_vfs.wasm
